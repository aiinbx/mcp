name: Release

# Nothing publishes on a push to main: a release is a version bump in
# package.json plus a `v<version>` tag.

on:
  push:
    tags: ["v*"]

concurrency: release-${{ github.ref }}

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: `npm publish` trades this job's OIDC token for
      # a short-lived publish token, so there is no npm secret to leak or renew.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later, which not every Node 24
      # ships with.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: bun run typecheck && bun test && bun run build
      # What `npx aiinbx-mcp` runs: the bundle, on Node, with nothing installed.
      - name: The built command starts on Node
        run: test "$(node dist/index.js --version)" = "$(node -p "require('./package.json').version")"
      - run: npm publish --access public

  release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Published to npm as [aiinbx-mcp ${TAG#v}](https://www.npmjs.com/package/aiinbx-mcp/v/${TAG#v})."
